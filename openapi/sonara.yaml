openapi: 3.1.0
info:
  title: SONARA One Runtime API
  version: 0.1.0
  summary: Canonical contract for the API surface registered by the production Express runtime.
  license:
    name: MIT
    identifier: MIT
  description: |
    This contract describes the current API without changing response shapes. JSON errors use
    `{ ok: false, code, message?, service?, missing? }`. Some browser form requests negotiate
    HTML redirects or confirmation pages; JSON clients should send `Accept: application/json`.
servers:
  - url: /
    description: Same-origin production runtime
security: []
tags:
  - name: Platform
    description: Health, readiness, support, and route inventory.
  - name: Billing
    description: Stripe checkout, portal, status, and signed webhook operations.
  - name: Administration
    description: Owner-only environment, database, storage, and operational summaries.
  - name: Business Builder
    description: Workspace offers, intake, records, employee invitations, and launch checklist.
  - name: Creator Studio
    description: Creator assets, offers, records, and music project operations.
  - name: Growth Studio
    description: Campaign, lead, record, and readiness operations.
  - name: Formulas
    description: Deterministic formula discovery, evaluation, and persisted results.
  - name: Ecosystem
    description: SONARA ecosystem manifest and data readiness.
  - name: Infrastructure
    description: Declared infrastructure manifest and readiness.
  - name: Operations
    description: Authenticated business, location, motion, and time-entry records.
  - name: Integrations
    description: Provider metadata and auditable integration jobs.
  - name: Sensory
    description: Opt-in sound and haptic configuration records.
paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [Platform]
      summary: Return process and deployment health metadata.
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/readiness:
    get:
      operationId: getReadiness
      tags: [Platform]
      summary: Return non-secret service configuration readiness.
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/support/status:
    get:
      operationId: getSupportStatus
      tags: [Platform]
      summary: Return the configured support channel state.
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/routes/public:
    get:
      operationId: getPublicRouteRegistry
      tags: [Platform]
      summary: Return the public route registry used by verification.
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/checkout/session:
    get:
      operationId: getCheckoutSessionMethodNotice
      tags: [Billing]
      summary: Explain that checkout session creation requires POST.
      responses:
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
    post:
      operationId: createCheckoutSession
      tags: [Billing]
      summary: Create a Stripe Checkout session for an allowed plan.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "303": { description: Browser form redirect to login or Stripe Checkout. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/billing/create-checkout-session:
    post:
      operationId: createBillingCheckoutSession
      tags: [Billing]
      summary: Compatibility endpoint for creating a Stripe Checkout session.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "303": { description: Browser form redirect to login or Stripe Checkout. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/billing/create-portal-session:
    post:
      operationId: createBillingPortalSession
      tags: [Billing]
      summary: Create a Stripe customer portal session.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "303": { description: Browser form redirect to login or the customer portal. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/billing/status:
    get:
      operationId: getBillingStatus
      tags: [Billing]
      summary: Return non-secret checkout readiness and an unverified paid-state marker.
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      tags: [Billing]
      summary: Receive and verify a raw Stripe webhook event.
      security: [{ stripeSignature: [] }]
      requestBody: { $ref: "#/components/requestBodies/StripeEvent" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/stripe/webhook:
    post:
      operationId: receiveStripeWebhookAlias
      tags: [Billing]
      summary: Compatibility endpoint for verified raw Stripe events.
      security: [{ stripeSignature: [] }]
      requestBody: { $ref: "#/components/requestBodies/StripeEvent" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/admin/overview:
    get:
      operationId: getAdminOverview
      tags: [Administration]
      summary: Return the owner-only operational overview.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/env-status:
    get:
      operationId: getAdminEnvironmentStatus
      tags: [Administration]
      summary: Return owner-only non-secret environment readiness.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/database-readiness:
    get:
      operationId: getAdminDatabaseReadiness
      tags: [Administration]
      summary: Return owner-only database readiness checks.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/storage-readiness:
    get:
      operationId: getAdminStorageReadiness
      tags: [Administration]
      summary: Return owner-only private storage bucket readiness.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/model-safety-resilience:
    get:
      operationId: getAdminModelSafetyResilience
      tags: [Administration]
      summary: Return the quarantined OBLITERATUS reference, defensive model-safety controls, and execution prohibitions.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/admin/model-safety-resilience/review:
    post:
      operationId: reviewAdminModelSafetyProposal
      tags: [Administration]
      summary: Classify a proposed model-safety activity without executing models, modifying weights, or changing infrastructure.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 160 }
                product: { type: string, maxLength: 120 }
                summary: { type: string, maxLength: 2000 }
                requestedAction: { type: string, maxLength: 1000 }
                dataTypes:
                  type: array
                  maxItems: 30
                  items: { type: string, maxLength: 240 }
                outputs:
                  type: array
                  maxItems: 30
                  items: { type: string, maxLength: 240 }
                controls:
                  type: array
                  maxItems: 30
                  items: { type: string, maxLength: 240 }
                environment:
                  type: string
                  enum: [documentation, offline_research, isolated_worker, staging, production]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/admin/system-design-intelligence:
    get:
      operationId: getAdminSystemDesignIntelligence
      tags: [Administration]
      summary: Return the governed reference-only architecture topic catalog and SONARA module mappings.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/admin/system-design-intelligence/review:
    post:
      operationId: reviewAdminSystemDesignArchitecture
      tags: [Administration]
      summary: Produce a deterministic, review-required architecture mapping for one SONARA module.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moduleKey]
              properties:
                moduleKey: { type: string, maxLength: 160 }
                product: { type: string, maxLength: 120 }
                summary: { type: string, maxLength: 2000 }
                capabilities:
                  type: array
                  maxItems: 30
                  items: { type: string, maxLength: 240 }
                risks:
                  type: array
                  maxItems: 30
                  items: { type: string, maxLength: 240 }
                constraints:
                  type: array
                  maxItems: 30
                  items: { type: string, maxLength: 240 }
                scaleTier:
                  type: string
                  enum: [prototype, launch, growth, large_scale]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/admin/database-management:
    get:
      operationId: getAdminDatabaseManagement
      tags: [Administration]
      summary: Return the founder-only live read-only PostgreSQL and Supabase metadata catalog.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: section
          required: false
          schema:
            type: string
            enum: [schema-visualizer, tables, functions, triggers, enumerated-types, extensions, indexes, publications, access-control, policies, roles, configuration, settings, platform, replication, backups, migrations]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/admin/reference-intelligence:
    get:
      operationId: getAdminReferenceIntelligence
      tags: [Administration]
      summary: Return the founder-only governed external-reference catalog and review policy.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/business-builder/employees/invite:
    post:
      operationId: inviteBusinessBuilderEmployee
      tags: [Business Builder]
      summary: Record a manager-controlled employee invitation without accepting a password.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/business-builder/offers:
    post:
      operationId: createBusinessBuilderOffer
      tags: [Business Builder]
      summary: Build and save a Business Builder offer.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/business-builder/intake:
    post:
      operationId: createBusinessBuilderIntake
      tags: [Business Builder]
      summary: Save a Business Builder intake request and activity record.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/business-builder/records:
    get:
      operationId: listBusinessBuilderRecords
      tags: [Business Builder]
      summary: List records after paid-or-owner entitlement checks.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/business-builder/readiness:
    get:
      operationId: getBusinessBuilderReadiness
      tags: [Business Builder]
      summary: Return Business Builder product readiness.
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/business-builder/checklist:
    get:
      operationId: listBusinessBuilderChecklist
      tags: [Business Builder]
      summary: List launch checklist items for the active workspace.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
    post:
      operationId: createBusinessBuilderChecklistItem
      tags: [Business Builder]
      summary: Create a launch checklist item.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
    patch:
      operationId: updateBusinessBuilderChecklistItem
      tags: [Business Builder]
      summary: Update a launch checklist item by request-body id.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
    delete:
      operationId: deleteBusinessBuilderChecklistItem
      tags: [Business Builder]
      summary: Delete a launch checklist item by request-body id.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/creator-studio/assets:
    post:
      operationId: createCreatorStudioAsset
      tags: [Creator Studio]
      summary: Validate and save a creator asset record.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/creator-studio/offers:
    post:
      operationId: createCreatorStudioOffer
      tags: [Creator Studio]
      summary: Build and save a Creator Studio offer.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/creator-studio/records:
    get:
      operationId: listCreatorStudioRecords
      tags: [Creator Studio]
      summary: List records after paid-or-owner entitlement checks.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/creator-studio/readiness:
    get:
      operationId: getCreatorStudioReadiness
      tags: [Creator Studio]
      summary: Return Creator Studio product readiness.
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/creator/music-system/readiness:
    get:
      operationId: getCreatorMusicSystemReadiness
      tags: [Creator Studio]
      summary: Return protected Creator Music System table and field readiness.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/growth-studio/campaigns:
    post:
      operationId: createGrowthStudioCampaign
      tags: [Growth Studio]
      summary: Build and save a campaign plan.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/growth-studio/leads:
    post:
      operationId: createGrowthStudioLead
      tags: [Growth Studio]
      summary: Save a consent-aware lead follow-up record.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/creator-studio/assets:
    get:
      operationId: listCreatorStudioAssets
      tags: [Creator Studio]
      summary: List every saved creative asset in the caller's organization.
      description: Archived records are hidden unless include_archived=true.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: include_archived
          required: false
          schema: { type: string, enum: ["true"] }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/creator-studio/assets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCreatorStudioAsset
      tags: [Creator Studio]
      summary: Get one saved creative asset.
      description: A record belonging to another organization reports 404 rather than 403, so the response cannot confirm that the identifier exists.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/SetupRequired" }
    patch:
      operationId: updateCreatorStudioAsset
      tags: [Creator Studio]
      summary: Correct one saved creative asset.
      description: Only the fields this resource declares editable are accepted; any other field is refused rather than ignored.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/SetupRequired" }
    post:
      operationId: updateCreatorStudioAssetFromForm
      tags: [Creator Studio]
      summary: Correct one asset from a submitted HTML form.
      description: Identical to PATCH on this path. HTML forms cannot send PATCH, and the workspace pages are server-rendered and work without JavaScript. A browser is redirected back to its records; a client sending Accept application/json receives the updated record.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonOrFormBody" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "303": { description: "Form submission accepted; the browser is redirected back to the records list." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/creator-studio/assets/{id}/archive:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: archiveCreatorStudioAsset
      tags: [Creator Studio]
      summary: Take one saved creative asset off the active list.
      description: Sets status to archived. The record is retained and can be restored.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/creator-studio/assets/{id}/restore:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restoreCreatorStudioAsset
      tags: [Creator Studio]
      summary: Return one archived saved creative asset to the active list.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/SetupRequired" }
  /api/growth-studio/campaigns:
    get:
      operationId: listGrowthStudioCampaigns
      tags: [Growth Studio]
      summary: List every saved campaign in the caller's organization.
      description: Archived records are hidden unless include_archived=true.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: include_archived
          required: false
          schema: { type: string, enum: ["true"] }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
