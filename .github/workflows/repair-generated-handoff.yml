name: Repair generated handoff evidence

on:
  push:
    branches:
      - fix/release-security-gates-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/release-security-gates-20260916
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Regenerate repository-derived handoff
        run: node scripts/generate-handoff-prompt.mjs
      - name: Commit generated evidence when it changed
        shell: bash
        run: |
          if git diff --quiet -- docs/HANDOFF_PROMPT.md; then
            echo "Handoff evidence already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HANDOFF_PROMPT.md
          git commit -m "docs: regenerate handoff evidence"
          git push origin HEAD:fix/release-security-gates-20260916
