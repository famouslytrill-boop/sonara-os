name: Repair generated handoff evidence

on:
  push:
    branches:
      - fix/release-security-gates-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/release-security-gates-20260916
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Modernize supported action runtimes
        run: node -e "const fs=require('node:fs'),path=require('node:path'); const r=[['actions/setup-node@v4','actions/setup-node@v7'],['actions/setup-node@v5','actions/setup-node@v7'],['actions/setup-node@v6','actions/setup-node@v7'],['pnpm/action-setup@v4','pnpm/action-setup@v6'],['pnpm/action-setup@v5','pnpm/action-setup@v6'],['actions/upload-artifact@v4','actions/upload-artifact@v6'],['actions/upload-artifact@v5','actions/upload-artifact@v6'],['supabase/setup-cli@v1','supabase/setup-cli@v3'],['supabase/setup-cli@v2','supabase/setup-cli@v3']]; for(const n of fs.readdirSync('.github/workflows')){if(!/\\.ya?ml$/.test(n))continue; const f=path.join('.github/workflows',n),s=fs.readFileSync(f,'utf8'); let x=s; for(const [a,b] of r)x=x.split(a).join(b); if(x!==s)fs.writeFileSync(f,x)}"

      - name: Regenerate repository-derived handoff
        run: node scripts/generate-handoff-prompt.mjs

      - name: Static syntax checks
        run: |
          node --check lib/sonara-multipart.cjs
          node --check routes/sonara-ai-integrations-routes.cjs
          node --check tests/hosted-model-providers.cjs

      - name: Run focused release-gate regressions
        run: pnpm exec mocha tests/an-upload-arrives-intact.test.js tests/hosted-model-providers.cjs tests/the-handoff-counts-what-mocha-runs.test.js

      - name: Verify generated handoff is stable
        run: node scripts/generate-handoff-prompt.mjs --check

      - name: Commit validated repair changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repair branch already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HANDOFF_PROMPT.md .github/workflows
          git commit -m "ci: refresh supported action runtimes"
          git push origin HEAD:fix/release-security-gates-20260916
