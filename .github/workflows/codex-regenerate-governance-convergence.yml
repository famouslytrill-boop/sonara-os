name: Codex Regenerate Governance Convergence Evidence

on:
  push:
    branches: [codex/lease-license-risk-controls-20261006]

permissions:
  contents: write

concurrency:
  group: sonara-governance-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate exact-tree evidence
        run: |
          pnpm run fix:proprietary-notice
          pnpm run capability-map:write
          pnpm run report:capability-coverage
          node scripts/generate-handoff-prompt.mjs
      - name: Commit generated evidence when changed
        run: |
          if git diff --quiet -- scripts/verify-proprietary-notice.mjs data/capability-inventory.json docs/CAPABILITY_MAP.md docs/CAPABILITY_ROUTE_SCHEMA_COVERAGE.md docs/HANDOFF_PROMPT.md; then
            echo "Governance convergence evidence already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-proprietary-notice.mjs data/capability-inventory.json docs/CAPABILITY_MAP.md docs/CAPABILITY_ROUTE_SCHEMA_COVERAGE.md docs/HANDOFF_PROMPT.md
          git commit -m "Regenerate governance convergence evidence"
          git push origin HEAD:${{ github.ref_name }}
