name: SONARA Production Connectivity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: ["SONARA Industries CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-connectivity-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  production-connectivity:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Wait for the exact main deployment
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          echo "EXPECTED_COMMIT_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "WAIT_FOR_DEPLOYMENT_SECONDS=600" >> "$GITHUB_ENV"

      - name: Verify production routes, providers, PWA, and access boundaries
        env:
          BASE_URL: https://sonaraindustries.com
          REQUEST_TIMEOUT_MS: "20000"
        run: pnpm run smoke:live

      # Always say which build was tested next to the live smoke result.
      #
      # workflow_run supplies EXPECTED_COMMIT_SHA above, so that path waits for
      # the exact main build before it tests it. Scheduled and manual runs do not
      # name an expected SHA; they intentionally inspect whatever production is
      # currently serving and then report that SHA here.
      #
      # This workflow no longer runs on pull_request. A PR cannot change the
      # already-deployed site, so making a PR fail because production is stale or
      # has an external-provider problem conflates branch validation with an
      # operational production alarm. PR correctness remains covered by SONARA
      # Industries CI and SONARA One Validation; this job is now only a live
      # production monitor.
      - name: Report which build production is serving
        if: always()
        run: pnpm run report:deployed-commit
