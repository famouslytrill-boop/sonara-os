name: Regenerate PR508 Capability Artifacts Once

on:
  push:
    branches: [fix/post-consolidation-ci-matrix-20261008]
    paths:
      - ".github/workflows/codex-pr508-regenerate-capability-once.yml"

permissions:
  contents: write

concurrency:
  group: sonara-pr508-capability-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/post-consolidation-ci-matrix-20261008
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild both canonical artifacts from the checked-out source
        run: |
          set -euo pipefail
          node scripts/generate-capability-inventory.cjs --write
          node scripts/generate-capability-inventory.cjs --check
          git diff --check
      - name: Commit source-derived outputs and remove this one-time workflow
        run: |
          set -euo pipefail
          rm .github/workflows/codex-pr508-regenerate-capability-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capability-inventory.json docs/CAPABILITY_MAP.md
          git add -u .github/workflows/codex-pr508-regenerate-capability-once.yml
          git diff --cached --quiet && { echo 'Nothing changed: generator failed to update tracked files.' >&2; exit 1; }
          git commit -m "chore(ci): regenerate canonical capability maps at PR508 exact source"
          git push origin HEAD:fix/post-consolidation-ci-matrix-20261008
