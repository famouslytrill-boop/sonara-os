name: One-time enable production Google provider

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-time-enable-google-provider.yml"
      - "scripts/enable-google-oauth-provider.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-one-time-google-provider-enable
  cancel-in-progress: false

jobs:
  enable-google-provider:
    name: Enable and verify hosted Google provider
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ops/enable-google-provider-20260918'
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout exact ops commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Enable existing Google provider and verify readback
        run: node scripts/enable-google-oauth-provider.mjs --enable
