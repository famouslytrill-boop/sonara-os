name: Web Push Security Fixture Contracts

on:
  pull_request:
    paths:
      - "tests/a-push-retry-obeys-provider-and-expiration.test.js"
      - "lib/sonara-web-push.cjs"
      - "lib/sonara-delivery-retry-policy.cjs"
      - ".github/workflows/web-push-security-fixture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-push-fixture:
    name: Synthetic Web Push fixture (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.7.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=false
      - name: Run isolated Web Push retry contracts under Mocha
        run: pnpm exec mocha --no-config --require tests/setup-env.cjs --timeout 15000 --exit tests/a-push-retry-obeys-provider-and-expiration.test.js
