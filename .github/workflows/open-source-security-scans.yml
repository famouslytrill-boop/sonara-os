name: Open Source Security Scans

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "backend/**"
      - "python/**"
      - "tools/**"
      - "Dockerfile"
      - ".github/workflows/**"
      - "lib/**"
      - "routes/**"
      - "scripts/**"
      - "server.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-open-source-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare evidence directory
        run: mkdir -p artifacts/security-open-source

      - name: Install checksum-pinned OSV Scanner 2.6.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 \
            --output /tmp/osv-scanner
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  /tmp/osv-scanner" | sha256sum --check
          chmod 0755 /tmp/osv-scanner
          /tmp/osv-scanner --version | tee artifacts/security-open-source/osv-version.txt

      - name: Scan maintained dependency manifests with OSV Scanner
        id: osv
        continue-on-error: true
        shell: bash
        run: |
          set +e
          /tmp/osv-scanner scan source \
            --format=json \
            --lockfile=pnpm-lock.yaml \
            --lockfile=requirements.txt:backend/requirements.txt \
            --lockfile=requirements.txt:tools/disposable-domains/requirements.txt \
            --lockfile=requirements.txt:tools/voice-clone/requirements.txt \
            . > artifacts/security-open-source/osv.json
          status=$?
          set -e
          printf '%s\n' "$status" > artifacts/security-open-source/osv.exit
          OSV_REPORT=artifacts/security-open-source/osv.json node --input-type=module <<'NODE' > artifacts/security-open-source/osv-summary.json
          import fs from "node:fs";
          let report = {};
          try { report = JSON.parse(fs.readFileSync(process.env.OSV_REPORT, "utf8")); } catch {}
          const findings = [];
          for (const result of report.results || []) {
            const source = result.source?.path || result.source?.name || "unknown";
            for (const pkg of result.packages || []) {
              const name = pkg.package?.name || "unknown";
              const version = pkg.package?.version || null;
              for (const vuln of pkg.vulnerabilities || []) {
                findings.push({ source, package: name, version, id: vuln.id || null });
              }
            }
          }
          console.log(JSON.stringify({ findingCount: findings.length, findings }, null, 2));
          NODE
          cat artifacts/security-open-source/osv-summary.json
          exit "$status"

      - name: Record optional OpenVoice engine vulnerability evidence
        id: osv_openvoice
        continue-on-error: true
        shell: bash
        run: |
          set +e
          /tmp/osv-scanner scan source \
            --format=json \
            --lockfile=requirements.txt:tools/voice-clone/requirements-openvoice.txt \
            . > artifacts/security-open-source/osv-openvoice.json
          status=$?
          set -e
          printf '%s\n' "$status" > artifacts/security-open-source/osv-openvoice.exit
          echo "OpenVoice engine scan exit: $status (advisory-only until the never-executed engine is compatibility-validated)."
          exit 0

      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          /tmp/gitleaks-bin/gitleaks version | tee artifacts/security-open-source/gitleaks-version.txt

      - name: Block current-source secrets with Gitleaks
        id: gitleaks
        continue-on-error: true
        shell: bash
        run: |
          set +e
          /tmp/gitleaks-bin/gitleaks dir \
            --no-banner \
            --redact=100 \
            --log-level warn \
            --report-format json \
            --report-path /tmp/gitleaks-current.json \
            .
          status=$?
          set -e
          printf '%s\n' "$status" > artifacts/security-open-source/gitleaks.exit
          REPORT=/tmp/gitleaks-current.json node --input-type=module <<'NODE' > artifacts/security-open-source/gitleaks-summary.json
          import fs from "node:fs";
          let findings = [];
          try {
            const parsed = JSON.parse(fs.readFileSync(process.env.REPORT, "utf8"));
            findings = Array.isArray(parsed) ? parsed : [];
          } catch {}
          const safe = findings.map((finding) => ({
            rule: String(finding.RuleID || finding.ruleID || "unknown").slice(0, 120),
            file: String(finding.File || finding.file || "unknown").slice(0, 300),
            line: Number(finding.StartLine || finding.startLine || 0) || null,
            fingerprint: String(finding.Fingerprint || finding.fingerprint || "").slice(0, 300) || null
          }));
          console.log(JSON.stringify({ findingCount: safe.length, findings: safe }, null, 2));
          NODE
          cat artifacts/security-open-source/gitleaks-summary.json
          rm -f /tmp/gitleaks-current.json
          exit "$status"

      - name: Record sanitized full-history secret evidence
        id: gitleaks_history
        continue-on-error: true
        shell: bash
        run: |
          set +e
          /tmp/gitleaks-bin/gitleaks git \
            --no-banner \
            --redact=100 \
            --log-level warn \
            --report-format json \
            --report-path /tmp/gitleaks-history.json \
            .
          status=$?
          set -e
          printf '%s\n' "$status" > artifacts/security-open-source/gitleaks-history.exit
          REPORT=/tmp/gitleaks-history.json node --input-type=module <<'NODE' > artifacts/security-open-source/gitleaks-history-summary.json
          import fs from "node:fs";
          let findings = [];
          try {
            const parsed = JSON.parse(fs.readFileSync(process.env.REPORT, "utf8"));
            findings = Array.isArray(parsed) ? parsed : [];
          } catch {}
          const safe = findings.map((finding) => ({
            rule: String(finding.RuleID || finding.ruleID || "unknown").slice(0, 120),
            file: String(finding.File || finding.file || "unknown").slice(0, 300),
            line: Number(finding.StartLine || finding.startLine || 0) || null,
            commit: String(finding.Commit || finding.commit || "").slice(0, 80) || null,
            fingerprint: String(finding.Fingerprint || finding.fingerprint || "").slice(0, 300) || null
          }));
          const byRule = {};
          for (const finding of safe) byRule[finding.rule] = (byRule[finding.rule] || 0) + 1;
          console.log(JSON.stringify({ findingCount: safe.length, byRule, findings: safe }, null, 2));
          NODE
          cat artifacts/security-open-source/gitleaks-history-summary.json
          rm -f /tmp/gitleaks-history.json
          # Historical findings remain review evidence. The release-blocking
          # secret check is the current-source scan above; rewriting Git history
          # requires a separate coordinated credential-rotation decision.
          exit 0

      - name: Install checksum-pinned Trivy 0.74.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output /tmp/trivy.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tar.gz" | sha256sum --check
          mkdir -p /tmp/trivy-bin
          tar -xzf /tmp/trivy.tar.gz -C /tmp/trivy-bin trivy
          /tmp/trivy-bin/trivy --version | tee artifacts/security-open-source/trivy-version.txt

      - name: Scan maintained filesystem with Trivy
        id: trivy
        continue-on-error: true
        shell: bash
        run: |
          set +e
          /tmp/trivy-bin/trivy fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs archive \
            --skip-files tools/voice-clone/requirements-openvoice.txt \
            --format json \
            --output artifacts/security-open-source/trivy.json \
            .
          status=$?
          set -e
          printf '%s\n' "$status" > artifacts/security-open-source/trivy.exit
          TRIVY_REPORT=artifacts/security-open-source/trivy.json node --input-type=module <<'NODE' > artifacts/security-open-source/trivy-summary.json
          import fs from "node:fs";
          let report = {};
          try { report = JSON.parse(fs.readFileSync(process.env.TRIVY_REPORT, "utf8")); } catch {}
          const vulnerabilities = [];
          const misconfigurations = [];
          for (const result of report.Results || []) {
            const target = result.Target || "unknown";
            for (const vuln of result.Vulnerabilities || []) {
              vulnerabilities.push({
                target,
                id: vuln.VulnerabilityID || null,
                package: vuln.PkgName || null,
                installed: vuln.InstalledVersion || null,
                fixed: vuln.FixedVersion || null,
                severity: vuln.Severity || null
              });
            }
            for (const item of result.Misconfigurations || []) {
              if (item.Status === "FAIL") {
                misconfigurations.push({
                  target,
                  id: item.ID || null,
                  severity: item.Severity || null,
                  title: item.Title || null
                });
              }
            }
          }
          console.log(JSON.stringify({
            vulnerabilityCount: vulnerabilities.length,
            misconfigurationCount: misconfigurations.length,
            vulnerabilities,
            misconfigurations
          }, null, 2));
          NODE
          cat artifacts/security-open-source/trivy-summary.json
          exit "$status"

      - name: Write scanner gate summary
        if: always()
        shell: bash
        env:
          OSV_OUTCOME: ${{ steps.osv.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          OPENVOICE_OUTCOME: ${{ steps.osv_openvoice.outcome }}
          HISTORY_OUTCOME: ${{ steps.gitleaks_history.outcome }}
        run: |
          node --input-type=module <<'NODE' > artifacts/security-open-source/gate-summary.json
          const summary = {
            exactHead: process.env.GITHUB_SHA,
            sourceUpload: false,
            rawSecretReportPersisted: false,
            blockingScanners: {
              osv: process.env.OSV_OUTCOME,
              gitleaksCurrentSource: process.env.GITLEAKS_OUTCOME,
              trivyMaintainedFilesystem: process.env.TRIVY_OUTCOME
            },
            advisoryEvidence: {
              openVoiceEngine: process.env.OPENVOICE_OUTCOME,
              fullGitHistory: process.env.HISTORY_OUTCOME
            }
          };
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload sanitized scanner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonara-open-source-security-${{ github.run_id }}
          path: artifacts/security-open-source
          if-no-files-found: error
          retention-days: 30

      - name: Enforce maintained-source scanner gates after evidence upload
        if: always()
        shell: bash
        env:
          OSV_OUTCOME: ${{ steps.osv.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for pair in "OSV:$OSV_OUTCOME" "Gitleaks-current:$GITLEAKS_OUTCOME" "Trivy:$TRIVY_OUTCOME"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::${name} security gate outcome: ${outcome}"
              failed=1
            fi
          done
          exit "$failed"
