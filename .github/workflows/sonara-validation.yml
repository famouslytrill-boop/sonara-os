name: SONARA One Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/sonara-experience-engine]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.1.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite
        id: tests
        shell: bash
        run: |
          set +e
          pnpm exec mocha --pass-with-no-tests --reporter dot > /tmp/sonara-tests.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonara-test-diagnostics-${{ github.run_id }}
          path: /tmp/sonara-tests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify server build
        run: pnpm run build

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          pnpm run lint > /tmp/sonara-lint.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonara-lint-diagnostics-${{ github.run_id }}
          path: /tmp/sonara-lint.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Scan client bundle for secrets
        run: pnpm run scan:client-secrets
