name: SONARA One Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/sonara-experience-engine]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.1.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Was `pnpm run apply:runtime`. Regenerating here would defeat the codegen
      # freeze: every later step in this job would then run against a freshly
      # generated tree rather than the committed one, so stale committed output
      # would pass validation and only surface at deploy time. Verify instead.
      - name: Verify committed output matches the generators
        id: runtime
        shell: bash
        run: |
          set +e
          pnpm run verify:generated > /tmp/sonara-runtime.log 2>&1
          status=$?
          cat /tmp/sonara-runtime.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonara-runtime-diagnostics-${{ github.run_id }}
          path: /tmp/sonara-runtime.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Run full test suite
        id: tests
        shell: bash
        run: |
          set +e
          pnpm exec mocha --file tests/setup-env.cjs "tests/**/*.js" --pass-with-no-tests --reporter dot > /tmp/sonara-tests.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonara-test-diagnostics-${{ github.run_id }}
          path: /tmp/sonara-tests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify server build
        run: pnpm run build

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          pnpm run lint > /tmp/sonara-lint.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonara-lint-diagnostics-${{ github.run_id }}
          path: /tmp/sonara-lint.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Scan client bundle for secrets
        run: pnpm run scan:client-secrets
