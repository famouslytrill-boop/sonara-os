name: Controlled Production Deployment

# workflow_dispatch exists because its absence caused an outage.
#
# On 2026-08-04 this workflow deployed main, verified the apex was serving the
# expected commit, and reported success. Ten seconds later a manual "Redeploy"
# of a deployment from that morning was created in the Vercel dashboard, became
# the newest production deployment, and took the alias. Production ran the older
# build for hours while four merged pull requests sat unshipped and every signal
# stayed green.
#
# The dashboard button was reached for because there was no other way in: this
# workflow only ran on push, so redeploying production meant pushing a commit or
# going around the pipeline. Going around it skips the migration gate, the
# catalog boundary gate, and the post-deploy checks. A gated path that can be
# run on demand is what makes the ungated one unnecessary.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-controlled-production
  cancel-in-progress: false

jobs:
  validate-migrate-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_tjHnRTtPAagk3RcaEte9SRla
      VERCEL_PROJECT_ID: prj_QN8mHacmlaJWSieVbjMFV5D7fmuY
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      APEX_URL: https://sonaraindustries.com
      WWW_URL: https://www.sonaraindustries.com

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.1

      - name: Require protected production credentials
        shell: bash
        # The RLS-bypassing service-role key is exposed only to explicit database
        # verification steps, never at job scope or to dependency installation,
        # application tests, builds, or the dynamically fetched Vercel CLI.
        #
        # ## Why the Stripe runtime credential is checked HERE
        #
        # It is validated again, properly, in "Synchronize verified Stripe
        # runtime secret to Vercel production" -- against the live configured
        # prices, which is the only check that can prove the key works. That
        # step is unchanged and remains the authority.
        #
        # The problem was WHEN it first spoke. That step is roughly the
        # seventeenth in this job: dependency install, audit, build, the whole
        # release test suite, the client-secret scan, lint, route smoke, the
        # database and storage contracts, the configuration and route registry,
        # the OpenAPI contract, the open-source controls, the project identity
        # check, the migration preview and the production environment pull all
        # run first. So an unset secret cost a full release chain before the run
        # said which one thing was wrong.
        #
        # That is not hypothetical. production-commit-drift.yml records it:
        # "every deploy run since 5 August had failed, the newest of them at a
        # single step, an empty STRIPE_RUNTIME_SECRET_KEY". Six weeks of
        # deployments, each paying for the whole chain to learn one fact that was
        # available in the first twenty seconds.
        #
        # ## It is deliberately no stricter than the step it precedes
        #
        # Same resolution order, same accept rule: `sk_live_` or fail. If this
        # accepted something that step rejects, a deploy would still die late;
        # if it rejected something that step accepts, this change would break a
        # working installation. Surrounding whitespace is REPORTED and not
        # failed on, because a prefix match tolerates it and only the live
        # validation downstream can say whether Stripe does.
        #
        # No key value is ever echoed, written to GITHUB_ENV, or put in the step
        # summary. Only which variable it came from and which shape class it is.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_RUNTIME_SECRET_KEY: ${{ secrets.STRIPE_RUNTIME_SECRET_KEY }}
          STRIPE_VERIFIER_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail

          # Named individually. `test -n "$X"` under `set -e` exits with no
          # message at all, so five credentials shared one silent failure and
          # the log showed `+ test -n ''` with nothing to say which.
          missing=""
          for name in VERCEL_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "$(eval "printf '%s' \"\${$name:-}\"")" ]; then
              missing="${missing}${missing:+, }${name}"
            fi
          done

          if [ -n "$missing" ]; then
            {
              echo "### Production credentials missing"
              echo
              echo "Not configured in the \`production\` environment: **${missing}**."
              echo
              echo "Nothing was built, migrated or deployed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Missing protected production credentials: ${missing}" >&2
            exit 1
          fi

          # The same fallback the synchronization step uses, so the two cannot
          # disagree about which secret is in play.
          runtime_key="${STRIPE_RUNTIME_SECRET_KEY:-${STRIPE_VERIFIER_SECRET_KEY:-}}"
          if [ -n "${STRIPE_RUNTIME_SECRET_KEY:-}" ]; then
            runtime_source="STRIPE_RUNTIME_SECRET_KEY"
          else
            runtime_source="STRIPE_SECRET_KEY (compatibility fallback)"
          fi

          # Shape only. Each class prints its own name and never the value.
          case "$runtime_key" in
            "")        runtime_shape="unset" ;;
            sk_live_*) runtime_shape="live_secret" ;;
            rk_live_*) runtime_shape="restricted_live_verifier" ;;
            sk_test_*) runtime_shape="test_mode_secret" ;;
            rk_test_*) runtime_shape="test_mode_restricted" ;;
            *)         runtime_shape="unrecognised_prefix" ;;
          esac

          runtime_whitespace="no"
          case "$runtime_key" in
            "") ;;
            [[:space:]]*|*[[:space:]]) runtime_whitespace="yes" ;;
          esac
          unset runtime_key

          if [ "$runtime_shape" != "live_secret" ]; then
            case "$runtime_shape" in
              unset)
                why="No runtime secret is configured. STRIPE_RUNTIME_SECRET_KEY is empty and STRIPE_SECRET_KEY is empty too, so there is nothing to promote." ;;
              restricted_live_verifier)
                why="The only value available is a restricted live key (rk_live_). That is the read-only price verifier and it is never promoted to the runtime: it can make the price audit pass while every customer and Checkout Session write fails." ;;
              test_mode_secret|test_mode_restricted)
                why="The configured value is a test-mode key. Production billing needs the live secret key." ;;
              *)
                why="The configured value does not begin with any recognised Stripe key prefix." ;;
            esac
            {
              echo "### Stripe runtime credential not usable"
              echo
              echo "- Resolved from: \`${runtime_source}\`"
              echo "- Shape: \`${runtime_shape}\`"
              echo "- Surrounding whitespace: \`${runtime_whitespace}\`"
              echo
              echo "${why}"
              echo
              echo "Fix: add a protected \`STRIPE_RUNTIME_SECRET_KEY\` secret in the \`production\` environment whose value begins \`sk_live_\`."
              echo "Full instructions: \`docs/owner/STRIPE-RUNTIME-KEY-CUTOVER.md\`."
              echo
              echo "**Nothing was built, migrated or deployed.** This is the first step in the job, so no release work was spent reaching it."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Stripe runtime credential unusable (source=${runtime_source}, shape=${runtime_shape}). ${why}" >&2
            echo "See docs/owner/STRIPE-RUNTIME-KEY-CUTOVER.md" >&2
            exit 1
          fi

          {
            echo "### Production credentials present"
            echo
            echo "Stripe runtime secret resolved from \`${runtime_source}\`, shape \`${runtime_shape}\`."
            if [ "$runtime_whitespace" = "yes" ]; then
              echo
              echo "> **Caution:** the value has leading or trailing whitespace, most likely a newline captured when it was pasted."
              echo "> It is accepted here because the synchronization step's live validation is the authority on whether Stripe accepts it."
              echo "> If that step fails to authenticate, re-paste the secret with no trailing newline."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # A false security finding here blocks a production release. See
        # scripts/audit-dependencies.mjs and SECURITY_NOTES.md.
        run: node scripts/audit-dependencies.mjs


      - name: Build release candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build 2>&1 | tee -a release-validation.log

      - name: Run release test suite
        shell: bash
        run: |
          set -euo pipefail
          pnpm test 2>&1 | tee -a release-validation.log

      - name: Scan release candidate for client-exposed secrets
        shell: bash
        run: |
          set -euo pipefail
          pnpm run scan:client-secrets 2>&1 | tee -a release-validation.log

      - name: Lint release candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm run lint 2>&1 | tee -a release-validation.log

      - name: Verify release route behavior
        shell: bash
        run: |
          set -euo pipefail
          pnpm run smoke:routes 2>&1 | tee -a release-validation.log

      - name: Verify release database and storage contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:db 2>&1 | tee -a release-validation.log

      - name: Verify release configuration and route registry
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:config 2>&1 | tee -a release-validation.log

      - name: Verify release OpenAPI contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:api 2>&1 | tee -a release-validation.log

      - name: Verify release open-source controls
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:open-source 2>&1 | tee -a release-validation.log

      # Confirm we are pointed at the intended, running production project
      # before anything is applied to it. A paused sibling project named
      # "sonara-industries-prod" exists in the same organization.
      - name: Verify production project identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-production-project-identity.mjs

      - name: Link and preview production database migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"

      # This pull and the Stripe check below sit AHEAD of the migration apply,
      # and that ordering is the whole point of them being here.
      #
      # They used to run after `supabase db push`. Between 8 and 9 September 2026
      # seven consecutive deployments therefore ran the push, failed the Stripe
      # check, and never deployed the code.
      #
      # CORRECTED 10 September 2026, and the correction is the more useful half.
      # This comment first said those runs had "applied every pending migration"
      # and left production's schema ahead of its code. They had not. The
      # migration set at the deployed commit 36c1b2a and at the tip of main are
      # byte-identical -- 115 files, none added, removed or edited across those
      # 44 commits -- so every one of those pushes was a no-op against a
      # database already current. There was no schema-ahead-of-code gap.
      #
      # The claim came from the run summaries saying "Schema changes were
      # already applied to production", which was written unconditionally
      # whenever a checkpoint file existed and asserted something it never
      # checked. That message is fixed below; this comment is corrected because
      # a wrong reason inside an explanation is what the next person reads
      # instead of checking.
      #
      # The reordering is still right, on its own merits rather than on that
      # story: when a migration IS pending, failing after the push leaves
      # production's schema ahead of the application running against it. This
      # ordering makes that impossible rather than merely unlikely.
      #
      # Nothing in either step needs a migration to have run. The dry-run above
      # has already proved the migration set applies; these two read Vercel and
      # Stripe. Moving them here turns that failure from "mutate the database,
      # then abort" into "abort having changed nothing".
      #
      # The cost, stated rather than glossed: .env.production.catalog-verification
      # now sits on the runner across the migration steps rather than only the
      # verification ones. Same job, same runner, same file three steps already
      # shared. The `if: always()` removal below and the `test ! -e` guard before
      # the deploy are unchanged, and they remain the thing that enforces it is
      # gone before any source leaves this machine.
      - name: Pull production environment for configuration verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          pnpm dlx vercel@59.19.1 env pull .env.production.catalog-verification \
            --environment=production \
            --yes \
            --token="$VERCEL_TOKEN"
          test -s .env.production.catalog-verification

      - name: Require live Google sign-in provider
        shell: bash
        run: |
          set -euo pipefail
          node --env-file=.env.production.catalog-verification scripts/verify-google-oauth-provider.mjs --require

      - name: Verify live Stripe prices match what the pricing page advertises
        shell: bash
        # The protected STRIPE_SECRET_KEY is intentionally a read-only verifier
        # credential. It needs only Prices/Products read access and must never be
        # promoted into the customer-facing runtime.
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          node --env-file=.env.production.catalog-verification scripts/verify-stripe-env.mjs --require-live

      # Production runtime billing creates Stripe customers and Checkout
      # Sessions, so a read-only rk_live_ verifier cannot be used here. Prefer a
      # separate protected STRIPE_RUNTIME_SECRET_KEY. For existing installations
      # that already keep a full sk_live_ key under STRIPE_SECRET_KEY, that value
      # is accepted as a compatibility fallback. A restricted rk_live_ key is
      # always rejected from runtime synchronization.
      #
      # Validate the selected runtime key against the same live configured prices
      # before changing Vercel. The secret is piped over stdin to Vercel and is
      # never written to the repository, diagnostics, step summary, or GITHUB_ENV.
      - name: Synchronize verified Stripe runtime secret to Vercel production
        shell: bash
        env:
          STRIPE_RUNTIME_SECRET_KEY: ${{ secrets.STRIPE_RUNTIME_SECRET_KEY }}
          STRIPE_VERIFIER_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          runtime_key="${STRIPE_RUNTIME_SECRET_KEY:-${STRIPE_VERIFIER_SECRET_KEY:-}}"
          case "$runtime_key" in
            sk_live_*) ;;
            *)
              echo "A full live Stripe runtime key is required. Configure the protected STRIPE_RUNTIME_SECRET_KEY secret with an sk_live_ key; the read-only verifier key will not be promoted."
              exit 1
              ;;
          esac
          STRIPE_SECRET_KEY="$runtime_key" \
            node --env-file=.env.production.catalog-verification scripts/verify-stripe-env.mjs --require-live
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          printf '%s' "$runtime_key" | pnpm dlx vercel@59.19.1 env add STRIPE_SECRET_KEY production \
            --force \
            --sensitive \
            --token="$VERCEL_TOKEN"
          unset runtime_key

      # Capture a rollback checkpoint BEFORE any schema change lands. Migrations
      # are applied ahead of the deployment, so without this there is no recorded
      # point to return to if a later step fails.
      #
      # Deliberately schema-only: a data dump would copy customer records into a
      # GitHub artifact. Data recovery is Supabase point-in-time recovery, for
      # which the recorded UTC timestamp below is the restore target.
      - name: Record pre-migration rollback checkpoint
        shell: bash
        run: |
          set -euo pipefail
          checkpoint_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # The currently-live commit, read from the running deployment. This is
          # the SHA to redeploy if the application half needs reverting.
          previous_sha="$(curl -sS --max-time 20 "$APEX_URL/api/health" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).deployment?.commitSha||'unknown')}catch{process.stdout.write('unknown')}})" \
            || echo "unknown")"

          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f pre-migration-schema.sql

          {
            echo "checkpoint_utc=$checkpoint_utc"
            echo "previous_production_sha=$previous_sha"
            echo "incoming_sha=$GITHUB_SHA"
          } > rollback-checkpoint.txt

          {
            echo "### Rollback checkpoint"
            echo "- PITR restore target (UTC): \`$checkpoint_utc\`"
            echo "- Previously live commit: \`$previous_sha\`"
            echo "- Runbook: docs/PRODUCTION_ROLLBACK_RUNBOOK.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # Read the dump that was just taken, instead of discovering production's
      # gaps one deployment at a time.
      #
      # `supabase db push` stops at the first failure, so a database missing
      # fifty columns reports them at one per run -- which is how this repository
      # spent 27 August fixing a missing table and 3 September fixing a missing
      # column. The dump above is the only honest description of that database
      # and nothing had ever read it.
      #
      # continue-on-error, deliberately: a schema gap is not a reason to refuse
      # to deploy the fix for it, and a diagnostic that can block the thing it
      # diagnoses is a diagnostic somebody deletes. It reports; the apply step
      # below still decides.
      - name: Report what production's schema is missing
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          node scripts/report-production-schema-gaps.mjs pre-migration-schema.sql

      - name: Upload rollback checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rollback-checkpoint-${{ github.run_id }}
          path: |
            rollback-checkpoint.txt
            pre-migration-schema.sql
          if-no-files-found: error
          retention-days: 30

      # Record whether this actually CHANGED anything, by asking the database
      # rather than by asking whether a file exists.
      #
      # The rollback summary at the end of this job used to say "Schema changes
      # were already applied to production" whenever rollback-checkpoint.txt was
      # present -- and that file is written before the push, unconditionally. So
      # the message announced a schema change on every run that got this far,
      # true or not.
      #
      # On 9 September 2026 that misled a reader into recording, in a commit
      # message, a sprint-log entry, a pull request body and a comment in this
      # file, that seven failed deployments had each moved production's schema
      # forward. They had not: the migration set at the deployed commit and at
      # the tip of main were byte-identical, so every one of those pushes was a
      # no-op against a database already at 115 of 115. A message asserting a
      # thing it never checked is the defect CLAUDE.md names, and this one was
      # believed and repeated, which is exactly the harm it does.
      #
      # Comparing dumps rather than parsing `supabase db push` output is
      # deliberate. The push reports in prose whether the remote was already
      # current, and a parser keyed to vendor wording silently stops matching
      # when the vendor rewords it -- which fails green. Two schema dumps either
      # differ or they do not, and that is a fact about the database.
      #
      # The test beside this asserts that wording never appears here, so this
      # comment states the shape rather than quoting the string.
      - name: Apply production database migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f post-migration-schema.sql

          # Guard against the comparison passing by measuring nothing: an empty
          # or missing dump must not read as "no change".
          test -s pre-migration-schema.sql
          test -s post-migration-schema.sql

          if cmp -s pre-migration-schema.sql post-migration-schema.sql; then
            echo "schema_changed=no" > migration-effect.txt
            echo "Production schema is byte-identical before and after the push: nothing was applied."
          else
            echo "schema_changed=yes" > migration-effect.txt
            echo "Production schema changed. A rollback point is recorded in rollback-checkpoint.txt."
          fi

      - name: Verify production catalog database boundary
        shell: bash
        # Sensitive variables pulled from Vercel are not returned as plaintext.
        # The service-role key is therefore injected from the protected GitHub
        # environment for this verification step only.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node --env-file=.env.production.catalog-verification scripts/verify-production-product-catalog.mjs --database-only

      - name: Verify complete production Supabase state
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node --env-file=.env.production.catalog-verification scripts/verify-production-supabase.mjs

      - name: Remove temporary production environment material
        if: always()
        shell: bash
        run: |
          rm -f .env.production.catalog-verification
          test ! -e .env.production.catalog-verification

      - name: Deploy validated source to Vercel production
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env.production.catalog-verification
          pnpm dlx vercel@59.19.1 deploy --prod --yes --token="$VERCEL_TOKEN" \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitRef="main" \
            --meta githubCommitMessage="Controlled SONARA production deployment" \
            2>&1 | tee vercel-deploy.log
          deployment_url=$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' vercel-deploy.log | tail -n 1)
          test -n "$deployment_url"
          echo "DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"

      - name: Verify aliases, commit, and authentication boundaries
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 36); do
            apex_status=$(curl -sS -o apex-health.json -w '%{http_code}' "$APEX_URL/api/health" || true)
            www_status=$(curl -sS -o www-health.json -w '%{http_code}' "$WWW_URL/api/health" || true)
            if [ "$apex_status" = "200" ] && [ "$www_status" = "200" ]; then
              if node - <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.GITHUB_SHA;
          const apex = JSON.parse(fs.readFileSync('apex-health.json', 'utf8'));
          const www = JSON.parse(fs.readFileSync('www-health.json', 'utf8'));
          if (apex.deployment?.commitSha !== expected || www.deployment?.commitSha !== expected) process.exit(1);
          if (apex.deployment?.branch !== 'main' || www.deployment?.branch !== 'main') process.exit(1);
          NODE
              then
                ready=true
                break
              fi
            fi
            sleep 10
          done
          test "$ready" = "true"

          lifecycle_api_status=$(curl -sS -o lifecycle-api.json -w '%{http_code}' "$APEX_URL/api/product-lifecycle/framework" || true)
          lifecycle_ui_status=$(curl -sS -o lifecycle-ui.txt -w '%{http_code}' "$APEX_URL/product-lifecycle" || true)
          provider_status=$(curl -sS -o providers.json -w '%{http_code}' "$APEX_URL/api/growth/providers" || true)
          control_status=$(curl -sS -o control.txt -w '%{http_code}' "$APEX_URL/growth-studio/control-center" || true)

          case "$lifecycle_api_status" in 401|402|403) ;; *) echo "Unexpected lifecycle API status: $lifecycle_api_status"; exit 1;; esac
          case "$lifecycle_ui_status" in 302|303|401|402|403) ;; *) echo "Unexpected lifecycle UI status: $lifecycle_ui_status"; exit 1;; esac
          case "$provider_status" in 401|402|403) ;; *) echo "Unexpected provider status: $provider_status"; exit 1;; esac
          case "$control_status" in 302|303|401|402|403) ;; *) echo "Unexpected control-center status: $control_status"; exit 1;; esac

          {
            echo "### Controlled SONARA production deployment"
            echo "- Deployment: ${DEPLOYMENT_URL}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Apex health: ${apex_status}"
            echo "- WWW health: ${www_status}"
            echo "- Product lifecycle API: ${lifecycle_api_status}, protected"
            echo "- Product lifecycle UI: ${lifecycle_ui_status}, protected"
            echo "- Growth provider API: ${provider_status}, protected"
            echo "- Growth control center: ${control_status}, protected"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production catalog pages and configured plan infrastructure
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_BASE_URL="$APEX_URL" \
          EXPECTED_COMMIT_SHA="$GITHUB_SHA" \
          node scripts/verify-production-product-catalog.mjs --pages-only

      # Migrations land before the deployment, so a failure past that point
      # leaves production schema ahead of production code. Surface the recorded
      # checkpoint rather than leaving the operator to reconstruct it.
      - name: Surface rollback instructions on failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### Deployment failed -- rollback may be required"
            echo ""
            # Three states, not two. The middle one is the one that was missing,
            # and its absence is what made this summary misleading: a run that
            # took a checkpoint and then applied nothing was reported in the
            # same words as a run that rewrote the schema.
            if [ -f rollback-checkpoint.txt ] && grep -q "schema_changed=yes" migration-effect.txt 2>/dev/null; then
              echo "Schema changes WERE applied to production -- the schema dump differs before and after. Checkpoint:"
              echo '```'
              cat rollback-checkpoint.txt
              echo '```'
              echo "Follow docs/PRODUCTION_ROLLBACK_RUNBOOK.md."
            elif [ -f rollback-checkpoint.txt ] && grep -q "schema_changed=no" migration-effect.txt 2>/dev/null; then
              echo "No schema change was applied: the production schema dump is byte-identical before and after the push."
              echo "A rollback checkpoint was still recorded, because it is taken before the push rather than after it."
              echo "**No database rollback is needed.** Whatever failed, failed after a push that did nothing."
            elif [ -f rollback-checkpoint.txt ]; then
              echo "A rollback checkpoint exists, but whether the push changed anything was NOT determined --"
              echo "migration-effect.txt is missing, so this run failed at or before the apply step."
              echo "Do not assume either way. Compare the schema against the checkpoint before acting:"
              echo '```'
              cat rollback-checkpoint.txt
              echo '```'
              echo "Follow docs/PRODUCTION_ROLLBACK_RUNBOOK.md."
            else
              echo "Failure occurred before any schema change was applied."
              echo "Production database is untouched; no database rollback is needed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: controlled-production-diagnostics-${{ github.run_id }}
          path: |
            rollback-checkpoint.txt
            migration-effect.txt
            release-validation.log
            vercel-deploy.log
            apex-health.json
            www-health.json
            lifecycle-api.json
            lifecycle-ui.txt
            providers.json
            control.txt
          if-no-files-found: ignore
          retention-days: 3
