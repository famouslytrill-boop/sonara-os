name: External Repository Health

on:
  pull_request:
    paths:
      - "data/open-source-tools.ts"
      - "docs/SONARA_EXTERNAL_REPOSITORY_REGISTRY.md"
      - "backend/requirements.txt"
      - "package.json"
      - "scripts/verify-open-source-registry.mjs"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-external-repositories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Validate registry policy and remote repository health
        # Authenticated on every run. The registry is large enough to exhaust
        # unauthenticated GitHub API quota, and pre-merge verification must not
        # skip an unchanged registered dependency simply because an earlier PR
        # introduced it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-open-source-registry.mjs --network
