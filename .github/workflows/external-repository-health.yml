name: External Repository Health

on:
  pull_request:
    paths:
      - "data/open-source-tools.ts"
      - "docs/SONARA_EXTERNAL_REPOSITORY_REGISTRY.md"
      - "backend/requirements.txt"
      - "package.json"
      - "scripts/verify-open-source-registry.mjs"
      - "scripts/verify-github-action-pins.mjs"
      - ".github/workflows/**"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-external-repositories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Validate registry policy and remote repository health
        # Authenticated, because unauthenticated is 60 requests an hour shared
        # across every runner on the same address, and this check reads 115
        # targets. It failed on 18 August 2026 with "rate limit reached" and
        # "confirmed none of 115 registered targets" -- the checker refusing to
        # report success on a run that established nothing, which is correct.
        #
        # scripts/verify-open-source-registry.mjs has read GITHUB_TOKEN since it
        # was written, and its own failure message says to check the token. The
        # workflow never passed one. `permissions: contents: read` above is
        # enough for the public repository metadata this reads.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-open-source-registry.mjs --network

      - name: Confirm each pinned action still declares its reviewed runtime
        # The offline half of this check (verify:action-pins, in verify:gates)
        # compares the workflows against a register in the repository. It cannot
        # catch the register itself being wrong, which is the failure that left a
        # "do the workflows use Node 20?" question unanswerable from the source
        # tree on 18 September 2026: seven SHAs, and no record of what had been
        # reviewed about any of them.
        #
        # This reads runs.using out of each manifest AT THE PINNED COMMIT and
        # refuses to pass when it disagrees with the register -- or when it could
        # not read the manifest at all. Unauthenticated on purpose: it fetches 8
        # files from raw.githubusercontent.com, which is not the metadata API the
        # step above needs a token for.
        run: node scripts/verify-github-action-pins.mjs --network
