name: Creator Phase 9 Inventory Export (Temporary)

on:
  push:
    branches:
      - fix/creator-phase9-route-data-contracts-20261009
  pull_request:
    branches:
      - fix/creator-phase8-proposal-contract-20261009

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate capability inventory from source
        run: |
          set -euo pipefail
          node scripts/generate-capability-inventory.cjs --write
          node scripts/generate-capability-inventory.cjs --check
          wc -c data/capability-inventory.json docs/CAPABILITY_MAP.md
      - name: Upload generated files for source-reviewed commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: creator-phase9-generated-inventory
          path: |
            data/capability-inventory.json
            docs/CAPABILITY_MAP.md
          if-no-files-found: error
          retention-days: 1
