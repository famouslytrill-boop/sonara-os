name: Industry Capacity Model

on:
  push:
    paths:
      - "scripts/simulate-industry-capacity.mjs"
      - ".github/workflows/industry-capacity-model.yml"
  pull_request:
    paths:
      - "scripts/simulate-industry-capacity.mjs"
      - "package.json"
      - ".github/workflows/industry-capacity-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity-model:
    name: Deterministic capacity model (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run offline deterministic model assertions
        run: node scripts/simulate-industry-capacity.mjs --self-test
      - name: Evaluate healthy illustrative scenario
        run: node scripts/simulate-industry-capacity.mjs --strict --tenants=100 --averageRequestsPerSecondPerTenant=0.02
      - name: Prove overcapacity is rejected in strict mode
        run: |
          if node scripts/simulate-industry-capacity.mjs --strict --tenants=10000; then
            echo "Expected overloaded planning scenario to exit non-zero" >&2
            exit 1
          fi
