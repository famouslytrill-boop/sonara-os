name: Codex Regenerate Capability Inventory

on:
  push:
    branches: [codex/linkedin-provider-proof-20261007]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/linkedin-provider-proof-20261007

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Regenerate final tracked capability artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/codex-regenerate-capability-inventory.yml
          pnpm run capability-map:write

      - name: Commit generator output when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/capability-inventory.json docs/CAPABILITY_MAP.md; then
            echo "Capability artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capability-inventory.json docs/CAPABILITY_MAP.md
          git commit -m "Regenerate final capability inventory for LinkedIn provider proof"
          git push origin HEAD:codex/linkedin-provider-proof-20261007
