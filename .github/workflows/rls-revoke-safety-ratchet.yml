name: RLS Revoke Safety Ratchet

on:
  pull_request:
    paths:
      - "tests/the-revoke-reasoning-is-still-true.test.js"
      - "docs/owner/OWNER-STEPS.md"
      - ".github/workflows/rls-revoke-safety-ratchet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-revoke-proof:
    name: Revocation safety evidence (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.7.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=false
      - name: Run focused Mocha security ratchet
        run: pnpm exec mocha --no-config --require tests/setup-env.cjs --timeout 15000 --exit tests/the-revoke-reasoning-is-still-true.test.js
      - name: Prove dropping mandatory production warning turns this gate red
        run: |
          set -euo pipefail
          cp docs/owner/OWNER-STEPS.md /tmp/sonara-rls-owner-original.md
          node - <<'NODE'
          const fs = require("node:fs");
          const file = "docs/owner/OWNER-STEPS.md";
          const before = fs.readFileSync(file, "utf8");
          const exact = "Do not revoke `EXECUTE` in production";
          if (!before.includes(exact)) throw new Error("mutation precondition not met");
          fs.writeFileSync(file, before.replaceAll(exact, "Production revoke may proceed without evidence"));
          NODE
          if pnpm exec mocha --no-config --require tests/setup-env.cjs --timeout 15000 --exit tests/the-revoke-reasoning-is-still-true.test.js > /tmp/sonara-rls-intentional-fail.log 2>&1; then
            echo "Security test did not reject an unsafe owner runbook" >&2
            exit 1
          fi
          if ! grep -q "requires the owner runbook to prohibit production revoke" /tmp/sonara-rls-intentional-fail.log; then
            echo "Security mutation failed for an unrelated reason" >&2
            tail -n 50 /tmp/sonara-rls-intentional-fail.log
            exit 1
          fi
          cp /tmp/sonara-rls-owner-original.md docs/owner/OWNER-STEPS.md
          pnpm exec mocha --no-config --require tests/setup-env.cjs --timeout 15000 --exit tests/the-revoke-reasoning-is-still-true.test.js
