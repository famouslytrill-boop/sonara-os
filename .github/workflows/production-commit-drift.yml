name: Production Commit Drift

# Does production still run what main says it runs?
#
# The deploy workflow already answers that at the moment of deploying: it polls
# the apex until /api/health reports the deployed commit, then reports success.
# On 2026-08-04 it did exactly that, correctly, and production was still wrong.
#
# A manual "Redeploy" of a morning deployment was created ten seconds after the
# pipeline's deploy, became the newest production deployment, and took the
# alias. The gate had already passed. Nothing looked again. Production served a
# build from twelve hours earlier for three and a half hours, with four merged
# pull requests unshipped, while the repository, the pull requests and the
# deploy runs were all green.
#
# A deploy-time check cannot catch that, because the drift happens after it. So
# this asks the question on a schedule instead, and the only thing it compares
# is the live commit against the tip of main -- the one fact that was wrong and
# that nothing was watching.

on:
  workflow_dispatch:
  schedule:
    # Every two hours, offset off the hour so it does not queue behind the
    # other scheduled workflows.
    - cron: "41 */2 * * *"

permissions:
  contents: read

concurrency:
  group: production-commit-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      APEX_URL: https://sonaraindustries.com
      # A deploy takes a couple of minutes, and a merge lands on main before the
      # deploy finishes. Below this age a mismatch means "deploying", not
      # "drifted", so it is reported and not failed.
      GRACE_SECONDS: "900"
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so the distance between the live commit and the tip of
          # main can be counted. `fetch-depth: 2` was enough to read main's own
          # commit date, which is all this used to report -- and "drifted" with
          # no magnitude reads the same at three hours as at three weeks.
          fetch-depth: 0

      - name: Compare the live commit against the tip of main
        shell: bash
        run: |
          set -euo pipefail

          expected="$(git rev-parse HEAD)"
          committed_at="$(git show -s --format=%ct HEAD)"
          now="$(date -u +%s)"
          age=$((now - committed_at))

          status="$(curl -sS --max-time 30 -o health.json -w '%{http_code}' "$APEX_URL/api/health" || true)"
          if [ "$status" != "200" ]; then
            echo "::error::Production /api/health returned ${status}."
            exit 1
          fi

          live="$(node -e "
            const health = require('./health.json');
            process.stdout.write(String(health.deployment?.commitSha || 'unknown'));
          ")"
          branch="$(node -e "
            const health = require('./health.json');
            process.stdout.write(String(health.deployment?.branch || 'unknown'));
          ")"

          {
            echo "### Production commit drift"
            echo "- Expected (tip of main): \`${expected}\`"
            echo "- Live (/api/health): \`${live}\`"
            echo "- Live branch: \`${branch}\`"
            echo "- Tip of main is ${age}s old"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$live" = "$expected" ]; then
            echo "Production is running the tip of main."
            exit 0
          fi

          if [ "$age" -lt "$GRACE_SECONDS" ]; then
            echo "::notice::Production is on ${live}, main is ${expected}, but main is only ${age}s old -- a deploy is probably still in flight."
            exit 0
          fi

          # How far behind, not merely that it is behind.
          #
          # This workflow was written for one cause -- a manual redeploy taking
          # the production alias away from a commit that had already passed the
          # deploy gate, which happened on 4 August and cost three and a half
          # hours. Its failure message asserted that cause.
          #
          # On 5 September 2026 it had been failing continuously and the cause
          # was a different one: no deployment had *succeeded* since 5 August,
          # so nothing ever took the alias -- it was never handed over. A
          # message that names the wrong cause is worse than one that names
          # none, because it is what the next person reads instead of looking.
          #
          # Neither cause is derivable from git. The distance is, and the
          # distance is what tells them apart: hours means a deploy was
          # overtaken, weeks means none has landed.
          behind="unknown"
          live_age="unknown"
          if git cat-file -e "${live}^{commit}" 2>/dev/null; then
            behind="$(git rev-list --count "${live}..${expected}" 2>/dev/null || echo unknown)"
            live_committed_at="$(git show -s --format=%ct "${live}" 2>/dev/null || echo '')"
            if [ -n "${live_committed_at}" ]; then
              live_age="$(( (now - live_committed_at) / 86400 )) days"
            fi
          else
            # Not a failure in itself: a live commit this clone cannot resolve is
            # a real state (a force-push, or a deploy from a branch that is gone)
            # and saying so beats printing a distance computed from nothing.
            echo "::warning::The live commit ${live} is not in this repository, so the distance behind main could not be counted."
          fi

          {
            echo "- Commits behind main: \`${behind}\`"
            echo "- Live commit age: \`${live_age}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Production is running ${live} while main is ${expected} -- ${behind} commit(s) behind, live build ${live_age} old."
          echo "Two causes look identical here and the distance tells them apart:"
          echo "  hours behind  -- a redeploy took the production alias away from a commit that had already passed the deploy gate."
          echo "  weeks behind  -- no deployment has succeeded, so the alias was never handed over in the first place."
          echo "Check Controlled Production Deployment's recent runs before assuming the first."
          echo "Re-run it (it accepts workflow_dispatch) rather than redeploying from the dashboard, so the migration and catalog gates run."
          exit 1
