name: Native migration replay

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede only earlier versions of this PR, never main or manual evidence.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    name: Node ${{ matrix.node }} / PostgreSQL ${{ matrix.postgres }} replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        postgres: [16, 17, 18]
    env:
      POSTGRES_MAJOR: ${{ matrix.postgres }}
      POSTGRES_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      # Collect evidence even when the external package repository fails before replay.
      - name: Initialize native replay evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p replay-evidence
          git rev-parse HEAD > replay-evidence/commit.txt
          node --version > replay-evidence/node-version.txt
          printf 'PostgreSQL major: %s\n' "$POSTGRES_MAJOR" > replay-evidence/target.txt
      - name: Install native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          {
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install --yes curl ca-certificates

            # Ubuntu 24.04 ships PostgreSQL 16; only versions 17/18 need PGDG.
            if [ "$POSTGRES_MAJOR" != "16" ]; then
              sudo install -d /usr/share/postgresql-common/pgdg
              curl --fail --show-error --silent --location \
                --retry 5 --retry-all-errors --retry-delay 3 \
                --connect-timeout 15 --max-time 120 \
                https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                -o "$RUNNER_TEMP/postgresql-signing-key.asc"
              sudo install -m 0644 "$RUNNER_TEMP/postgresql-signing-key.asc" \
                /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
              printf '%s\n' \
                'Types: deb' \
                'URIs: https://apt.postgresql.org/pub/repos/apt' \
                'Suites: noble-pgdg' \
                'Components: main' \
                'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
                | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
              sudo apt-get -o Acquire::Retries=5 update
            fi

            sudo apt-get -o Acquire::Retries=5 install --yes \
              "postgresql-$POSTGRES_MAJOR" "postgresql-contrib-$POSTGRES_MAJOR"
          } 2>&1 | tee replay-evidence/install.log
      - name: Replay the candidate migration history
        shell: bash
        env:
          SONARA_MIGRATION_REPLAY_REQUIRED: "1"
        run: |
          set -euo pipefail
          mkdir -p replay-evidence
          git rev-parse HEAD > replay-evidence/commit.txt
          sha256sum supabase/migrations/*.sql > replay-evidence/migrations.sha256
          id > replay-evidence/runner-identity.txt
          node --version > replay-evidence/node-version.txt
          if [ "$(id -u)" -eq 0 ]; then
            echo 'Native replay requires a non-root runner.' >&2
            exit 1
          fi
          "$POSTGRES_BIN/psql" --version > replay-evidence/postgresql-version.txt
          node scripts/verify-migration-replay.mjs --postgres-bin "$POSTGRES_BIN" 2>&1 | tee replay-evidence/replay.log
      - name: Preserve replay evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-migration-replay-node-${{ matrix.node }}-postgres-${{ matrix.postgres }}-${{ github.sha }}
          path: replay-evidence/
          if-no-files-found: error
          retention-days: 14
