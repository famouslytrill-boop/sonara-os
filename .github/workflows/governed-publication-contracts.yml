name: Governed Publication Contracts

on:
  pull_request:
    paths:
      - "lib/sonara-multi-channel-publication-preflight.cjs"
      - "lib/sonara-publishing-manifest.cjs"
      - "lib/sonara-publication-receipt-reconciliation.cjs"
      - "lib/sonara-customer-approval-board.cjs"
      - "lib/growth-studio-provider-registry.cjs"
      - "tests/sonara-multi-channel-publication-preflight.test.js"
      - ".github/workflows/governed-publication-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    name: Offline publication contracts (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Parse exact contract source
        run: |
          node --check lib/sonara-multi-channel-publication-preflight.cjs
          node --check lib/sonara-publishing-manifest.cjs
          node --check lib/sonara-publication-receipt-reconciliation.cjs
      - name: Execute offline real-dependency publication contract tests
        run: node --test tests/sonara-multi-channel-publication-preflight.test.js
