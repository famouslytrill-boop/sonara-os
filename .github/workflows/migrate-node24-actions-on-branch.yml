name: One-time Node 24 action runtime migration

on:
  push:
    branches:
      - codex/node24-operational-proof-20260917

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rewrite deprecated action majors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'actions/checkout@v4': 'actions/checkout@v5',
              'pnpm/action-setup@v4': 'pnpm/action-setup@v6',
              'actions/setup-node@v4': 'actions/setup-node@v7',
              'actions/upload-artifact@v4': 'actions/upload-artifact@v7',
              'github/codeql-action/init@v3': 'github/codeql-action/init@v4',
              'github/codeql-action/analyze@v3': 'github/codeql-action/analyze@v4',
              'supabase/setup-cli@v1': 'supabase/setup-cli@v3',
          }

          root = Path('.github/workflows')
          for path in sorted(root.glob('*.yml')):
              if path.name == 'migrate-node24-actions-on-branch.yml':
                  continue
              original = path.read_text()
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated)
                  print(f'updated {path}')
          PY

          # Remove this helper before the scan so its own replacement table is
          # not mistaken for a live workflow dependency. It never lands on main.
          rm .github/workflows/migrate-node24-actions-on-branch.yml

          if grep -R -nE 'actions/checkout@v4|pnpm/action-setup@v4|actions/setup-node@v4|actions/upload-artifact@v4|github/codeql-action/(init|analyze)@v3|supabase/setup-cli@v1' .github/workflows; then
            echo '::error::Deprecated Node-20-backed action reference remains.'
            exit 1
          fi

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'No migration changes remain.'
            exit 0
          fi
          git commit -m 'Complete Node 24 GitHub Actions runtime migration'
          git push origin HEAD:codex/node24-operational-proof-20260917
