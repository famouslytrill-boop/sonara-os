name: Browser Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "server.js"
      - "routes/**"
      - "lib/**"
      - "public/**"
      - "tests/browser/**"
      - ".github/workflows/browser-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-browser-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for locked Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build exact head
        run: pnpm run build

      - name: Start isolated local runtime
        env:
          NODE_ENV: test
          SONARA_OTEL_ENABLED: "false"
        run: |
          mkdir -p artifacts/browser
          node -e 'const app=require("./server"); const server=app.listen(3000,"127.0.0.1",()=>console.log("SONARA browser runtime ready")); process.on("SIGTERM",()=>server.close(()=>process.exit(0)));' > artifacts/browser/server.log 2>&1 &
          echo $! > artifacts/browser/server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/browser/server.log
          exit 1

      - name: Run browser contract
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          pnpm exec playwright test tests/browser/public-experience.spec.js \
            --browser=chromium \
            --reporter=line 2>&1 | tee artifacts/browser/playwright.log

      - name: Stop isolated local runtime
        if: always()
        run: |
          if [[ -f artifacts/browser/server.pid ]]; then
            kill "$(cat artifacts/browser/server.pid)" 2>/dev/null || true
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonara-browser-quality-${{ github.run_id }}
          path: artifacts/browser
          if-no-files-found: error
          retention-days: 30
