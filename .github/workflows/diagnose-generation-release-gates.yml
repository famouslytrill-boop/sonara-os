name: Diagnose generation release gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - verify:tenant-tables
          - verify:member-policies
          - verify:applied-migrations
          - verify:shape-repair
          - verify:handoff
          - verify:definer-exposure
          - verify:unreferenced-modules
          - verify:uncalled-factory-functions
          - verify:orphan-tables
          - verify:filter-encoding
          - verify:selected-columns
          - verify:tenant-queries
          - verify:request-tenant-ids
          - verify:stale-claims
          - verify:doc-counts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.gate }}
        env:
          SONARA_MIGRATION_REPLAY_REQUIRED: "1"
          SONARA_PYTHON_COVERAGE_COMPLETE: "1"
        run: pnpm run ${{ matrix.gate }}
