name: Diagnose unresolved release gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - verify:migration-replay
          - verify:python-coverage-floor
          - verify:production-safety
          - verify:scheduler
          - verify:recovery
          - verify:runbooks
          - verify:test-prod-boundary
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the Python test dependencies the coverage floor needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/disposable-domains/requirements.txt
          python -m pip install -r tools/voice-clone/requirements.txt
          python -m pip install ./python
      - name: Run ${{ matrix.gate }}
        env:
          SONARA_MIGRATION_REPLAY_REQUIRED: "1"
          SONARA_PYTHON_COVERAGE_COMPLETE: "1"
        run: pnpm run ${{ matrix.gate }}
