name: Regenerate handoff branch artifact

on:
  push:
    branches:
      - codex/durable-generation-lifecycle-20260916
      - codex/google-signin-no-legacy-rebase-20260919
      - codex/convergence-execution-contract-20261007
      - codex/business-management-scope-20261007
      - codex/reservation-workflows-20261007
      - codex/provider-runtime-gsc-20261008
      - codex/provider-broker-vault-gsc-20261008

permissions:
  contents: write

concurrency:
  group: sonara-branch-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This branch is edited through the GitHub connector. Generate the route
      # inventory from the full checkout here; never hand-edit derived evidence.
      - name: Regenerate convergence route evidence
        if: github.ref_name == 'codex/convergence-execution-contract-20261007'
        run: |
          pnpm run capability-map:write
          pnpm run report:capability-coverage
      - name: Regenerate management scope route evidence
        if: github.ref_name == 'codex/business-management-scope-20261007' || github.ref_name == 'codex/reservation-workflows-20261007'
        run: |
          pnpm run capability-map:write
          pnpm run report:capability-coverage
      - name: Regenerate provider broker governance evidence
        if: github.ref_name == 'codex/provider-broker-vault-gsc-20261008'
        run: node scripts/generate-product-integration-map.mjs
      - name: Regenerate handoff
        run: node scripts/generate-handoff-prompt.mjs
      - name: Commit generated handoff when changed
        run: |
          if git diff --quiet -- docs/HANDOFF_PROMPT.md data/capability-inventory.json docs/CAPABILITY_MAP.md docs/CAPABILITY_ROUTE_SCHEMA_COVERAGE.md docs/github-radar/GITHUB_RADAR_PRODUCT_INTEGRATION_MAP.md; then
            echo "Handoff already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HANDOFF_PROMPT.md data/capability-inventory.json docs/CAPABILITY_MAP.md docs/CAPABILITY_ROUTE_SCHEMA_COVERAGE.md docs/github-radar/GITHUB_RADAR_PRODUCT_INTEGRATION_MAP.md
          git commit -m "Regenerate route evidence and repository handoff"
          git push origin HEAD:${{ github.ref_name }}
