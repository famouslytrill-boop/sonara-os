name: Regenerate handoff branch artifact

on:
  push:
    branches:
      - codex/durable-generation-lifecycle-20260916
      - codex/google-signin-canonical-no-legacy-20260918
      - codex/google-signin-no-legacy-rebase-20260919

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate handoff
        run: node scripts/generate-handoff-prompt.mjs
      - name: Commit generated handoff when changed
        run: |
          if git diff --quiet -- docs/HANDOFF_PROMPT.md; then
            echo "Handoff already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HANDOFF_PROMPT.md
          git commit -m "Regenerate repository handoff"
          git push origin HEAD:${{ github.ref_name }}
