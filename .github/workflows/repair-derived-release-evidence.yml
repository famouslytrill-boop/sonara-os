name: Repair derived release evidence

on:
  push:
    branches:
      - fix/full-suite-release-gates-20260916

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/full-suite-release-gates-20260916
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate tenant-scoped table contract
        run: pnpm run gen:tenant-tables
      - name: Repair derived prose counts
        run: node scripts/repair-derived-release-evidence-20260916.mjs
      - name: Regenerate canonical handoff
        run: node scripts/generate-handoff-prompt.mjs
      - name: Verify repaired derived gates
        env:
          SONARA_MIGRATION_REPLAY_REQUIRED: "1"
          SONARA_PYTHON_COVERAGE_COMPLETE: "1"
        run: |
          pnpm run verify:tenant-tables
          pnpm run verify:doc-counts
          pnpm run verify:handoff
          pnpm run verify:applied-migrations
          pnpm run verify:orphan-tables
      - name: Remove one-shot repair machinery
        run: |
          rm scripts/repair-derived-release-evidence-20260916.mjs
          rm .github/workflows/repair-derived-release-evidence.yml
      - name: Commit verified derived repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No derived repair changes were required."
            exit 0
          fi
          git commit -m "Regenerate derived release evidence"
          git push origin HEAD:fix/full-suite-release-gates-20260916
