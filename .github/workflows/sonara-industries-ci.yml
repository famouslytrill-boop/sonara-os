name: SONARA Industries CI

on:
  pull_request:
  push:
    branches: [main]
  # Manually runnable, added 26 August 2026, because this is the workflow whose
  # signal matters most and it was the one that could not be asked for.
  #
  # GitHub Actions events fire only intermittently on this repository -- heads
  # have landed carrying nothing but a skipped "Supabase Preview". Every other
  # workflow here already accepts workflow_dispatch, so a missing signal could
  # be chased. This one could not, and it is the job that runs `verify:db`,
  # `typecheck` and `pnpm audit` -- the checks the lighter validation workflow
  # does not.
  #
  # PR #203 is what surfaced it: seven checks reported, and neither this job nor
  # "Build, test, and security" among them. An absent check reads as an absent
  # problem, which is this repository's recurring defect wearing a CI badge.
  workflow_dispatch:

jobs:
  sonara-industries:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run lint

      - name: Run tests
        shell: bash
        run: |
          set +e
          pnpm test > test-output.log 2>&1
          status=$?
          cat test-output.log
          exit $status

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sonara-test-output
          path: test-output.log
          if-no-files-found: error
          retention-days: 3

      - run: pnpm run build

      - name: Scan public code for client-exposed secrets
        run: pnpm run scan:client-secrets

      - name: Verify registered route behavior
        run: pnpm run smoke:routes

      - name: Verify database and storage contracts
        run: pnpm run verify:db

      # Every release gate, in one step, from the same definition the release
      # chain uses.
      #
      # This replaced four individual steps -- verify:config, verify:api,
      # verify:open-source and verify:migration-replay -- and the reason is
      # worth writing down rather than inferring from the diff.
      #
      # `verify:launch` is what this repository calls its gate: 31 commands, and
      # docs/owner/WHAT-IS-LEFT.md quotes the number at whoever is deciding
      # whether this is shippable. **Twenty-one of them ran in no workflow at
      # all.** Among them verify:doc-counts, verify:source-licence, verify:csp,
      # verify:margins, verify:orphan-tables and verify:stale-claims. A pull
      # request could be green on every check GitHub showed while two thirds of
      # the gate had never executed.
      #
      # That is not hypothetical. On 27 August two green pull requests merged
      # into a main that was red on verify:doc-counts, and CI did not notice
      # because CI does not run it. It surfaced only because the chain was run
      # by hand afterwards.
      #
      # `verify:gates` is now the single definition of everything after
      # verify:db, and `verify:launch` is defined in terms of it, so the two
      # cannot drift into disagreeing. tests/the-release-gate-is-the-gate.test.js
      # fails if a chain command is run by no workflow.
      #
      # SONARA_MIGRATION_REPLAY_REQUIRED turns "no PostgreSQL here" from a
      # notice into a failure. Locally the notice is right -- a contributor
      # without a database should not be blocked -- but a check whose skip path
      # is the one that always runs is not a check, and CI is where that has to
      # be impossible. ubuntu-latest ships PostgreSQL 16; the script starts its
      # own throwaway cluster and removes it, so no service container is needed.
      # The two pytest suites under tools/ so verify:python-coverage-floor can
      # actually grade the eleven files they cover. Without these installed the
      # gate records both suites as "not measured" and excuses their files --
      # which is the honest answer on a machine with no pytest, and the wrong
      # one here. SONARA_PYTHON_COVERAGE_COMPLETE turns that excuse into a
      # failure, for the same reason SONARA_MIGRATION_REPLAY_REQUIRED exists: a
      # check whose skip path is the one that always runs is not a check.
      # actions/setup-python pins the interpreter rather than inheriting whichever
      # python3 the runner image happens to ship.
      #
      # That version is load-bearing, which is not obvious. The coverage gate
      # takes its denominator from `co_lines()`, and which lines the compiler
      # emits code for differs between releases: over the 34 files it measures,
      # 3.12 and 3.13 agree exactly and 8 files differ from 3.11, moving
      # credits.py 5.2 percentage points -- further than the gate's own
      # regression tolerance. MEASURED_ON in the script is 3.12, so pinning 3.12
      # here is what keeps its regression comparison meaningful. It also matches
      # every Python job in dependency-scan.yml.
      #
      # What this is *not* for, recorded because it is what I first wrote here:
      # the pip step below does not need it. The step ran green before this
      # action was added, installing into /home/runner/.local/lib/python3.12 --
      # a user install, which is not what PEP 668 refuses. "Ubuntu's interpreter
      # is externally-managed so this would fail" was a plausible reason that
      # turned out not to describe the run, and a wrong reason in a comment is
      # what the next person reads instead of checking.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the Python test dependencies the coverage floor needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/disposable-domains/requirements.txt
          python -m pip install -r tools/voice-clone/requirements.txt
          # python/sonara_ops ran in no workflow at all until 3 September 2026:
          # eleven declared dependencies, a CLI entry point and a health check
          # grading the production database, none of it exercised anywhere
          # automated. Installed here so verify:python-coverage-floor measures
          # it rather than excusing it -- and installing it is itself the check
          # that its pyproject is satisfiable, which is how the >=3.13 floor
          # came to light: it made the package uninstallable under the 3.12
          # every job here pins.
          python -m pip install ./python

      - name: Run every release gate
        env:
          SONARA_MIGRATION_REPLAY_REQUIRED: "1"
          SONARA_PYTHON_COVERAGE_COMPLETE: "1"
        run: pnpm run verify:gates

      - name: Verify documentation links
        run: pnpm run test:docs

      # Last, not first, and the position is the whole point.
      #
      # This ran as step five until 4 September 2026. `pnpm audit` reaches
      # npm's advisory service, that service broke at ~22:06 UTC on 3
      # September, and every run since aborted here -- so typecheck, lint, the
      # full test suite, the build, the client-secret scan, the route and
      # database contract checks, the Python coverage floor and all twenty
      # release gates went unrun on every pull request for six hours. Twenty of
      # twenty-three checks read green while this job verified nothing past
      # installing dependencies.
      #
      # Nothing is weakened by moving it. It still runs on every push, it still
      # fails this job, and the audit level is unchanged -- a real advisory
      # still blocks the merge. What changes is that a third-party outage now
      # costs the audit result instead of costing every other check in the job.
      #
      # Fail-fast on an advisory is not lost either, and that was checked rather
      # than assumed: `dependency-scan.yml` runs `frontend-dependencies` and
      # `backend-dependencies` as their own parallel jobs, each calling the same
      # script. A genuine finding surfaces there within a minute regardless of
      # where this sits.
      #
      # Not a bare `pnpm audit`: a timeout there is reported as a security
      # finding. See scripts/audit-dependencies.mjs and SECURITY_NOTES.md.
      - run: node scripts/audit-dependencies.mjs

  supabase-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Supabase preview secrets
        id: supabase-secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase preview skipped because required Supabase secrets are not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Supabase preview secrets are configured."

      - uses: supabase/setup-cli@v1
        if: steps.supabase-secrets.outputs.configured == 'true'
        with:
          version: 2.109.1

      - name: Validate linked Supabase migrations without applying them
        if: steps.supabase-secrets.outputs.configured == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase --version
          test -d supabase/migrations
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
