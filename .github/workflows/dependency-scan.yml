name: dependency-scan

on:
  push:
  pull_request:

jobs:
  # Named "frontend-dependencies" and there is no frontend.
  #
  # It runs against the repository root -- `working-directory: .` -- and does
  # real work: the pnpm audit, the open-source registry check, the parse check
  # and the build. The name is a leftover from when scripts/verify.sh built a
  # `frontend/` directory, which this repository does not have and which that
  # script was deleted with on 19 August 2026.
  #
  # The name is left alone deliberately. A job's `name` is the check name
  # GitHub reports, so renaming it would retire "frontend-dependencies" and
  # create a new check -- and if the old one is a required status check on the
  # default branch, every pull request would then wait forever for a check that
  # no longer runs. Renaming it is a one-line change to make **after** somebody
  # has looked at the branch protection rules, not before.
  frontend-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit root dependencies
        id: root-audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level moderate --json > pnpm-audit.json
          status=$?
          cat pnpm-audit.json
          exit $status

      - name: Upload dependency audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-pnpm-audit-${{ github.run_id }}
          path: pnpm-audit.json
          if-no-files-found: error
          retention-days: 3

      - name: Enforce dependency audit
        if: steps.root-audit.outcome == 'failure'
        run: exit 1

      - name: Validate open-source dependency and repository policy
        run: pnpm run verify:open-source

      - name: Typecheck root app
        run: pnpm run typecheck

      - name: Build root app
        run: pnpm run build

  # backend/ is a real second application, and this is the only thing that says
  # so. It is a 370-line Python FastAPI service that CI installs, compiles,
  # imports and asserts two routes on -- so unlike the Next.js tree deleted on
  # 19 August 2026, it builds. What it does not do is deploy: vercel.json
  # bundles only {public/**,routes/**,lib/**} into one Node function, so nothing
  # in production serves it. Whether it should exist is an open question in
  # docs/SPRINT_LOG.md; it is not dead code and should not be deleted as though
  # it were.
  backend-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Verify installed Python dependency compatibility
        run: python -m pip check
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Compile and import the FastAPI backend
        run: |
          python -m py_compile main.py app/main.py
          python -c 'from app.main import app; paths = {route.path for route in app.routes}; assert "/health" in paths and "/brands" in paths'
