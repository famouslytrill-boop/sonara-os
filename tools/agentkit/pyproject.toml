[project]
name = "agentkit"
version = "0.1.0"
description = "A code-first toolkit for building single- and multi-agent systems in Python. Optimised for Gemini, not locked to it. No dependencies."
requires-python = ">=3.11"
# Deliberately empty, and checked by a test. Every dependency is a licence
# somebody has to have read, and this source is private.
dependencies = []

[project.scripts]
agentkit-devui = "agentkit.devui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentkit"]
